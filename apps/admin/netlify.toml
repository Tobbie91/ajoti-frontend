# Netlify site: customer / admin application
#
# In the Netlify dashboard, set Package directory to `apps/admin`.
# Netlify then uses this file as the site's build config AND treats
# `apps/admin` as the implicit base directory. All paths below are
# relative to that base, which is why `publish` is just `dist` and the
# command is the local-package `build`, not the workspace-level
# `build:admin` script that lives in the root package.json.
[build]
  command = "pnpm build"
  publish = "dist"
