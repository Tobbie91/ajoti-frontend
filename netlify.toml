# Repo-root netlify.toml holds ONLY the hostname-scoped redirect rules.
# The [build] block was removed because every Netlify site that read it
# ended up building the admin app regardless of which app it was meant to
# serve. Each app now owns its build config in apps/<app>/netlify.toml and
# each Netlify site must set Package directory to apps/<app> in its dashboard
# (Site configuration > Build & deploy).

[[redirects]]
  from = "https://admin.ajoti.com/*"
  to = "https://app.ajoti.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://user.ajoti.com/*"
  to = "https://app.ajoti.com/:splat"
  status = 301
  force = true
